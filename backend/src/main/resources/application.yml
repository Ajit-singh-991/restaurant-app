spring:
  application:
    name: restaurant-management

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:restaurant_db}
    username: ${POSTGRES_USER:restaurant_admin}
    password: ${POSTGRES_PASSWORD:changeme_in_production}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
  upload:
    menu-dir: ${UPLOAD_MENU_DIR:uploads/menu}
  jwt:
    secret: ${JWT_SECRET:default-secret-key-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost}
  mail:
    enabled: ${MAIL_RECEIPT_ENABLED:false}
    from: ${MAIL_FROM:noreply@restaurant.com}
  # Set to true once to reset all user passwords to 'password123' if login fails with seed data
  reset-seed-passwords: ${RESET_SEED_PASSWORDS:false}

logging:
  level:
    com.restaurant: DEBUG
    org.springframework.security: INFO
